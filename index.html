<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winterfell</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <section class="header">
            <div id="logo">
                <img src="Logo.svg" width="32px" height="auto" alt="Winterfell Logo">
                <p>WINTERFELL</p>
            </div>
            <div id="nav">
                <button class="nav-button">Feature</button>
                <button class="nav-button">Pricing</button>
                <button class="nav-button">Faq</button>
                <button class="nav-button">About</button>
            </div>
            <div id="profile">
                <img src="home.svg" alt="Home" width="20px" height="auto">
                <img src="Pen New Square.svg" alt="Pen" width="20px" height="auto">
                <button id="sign-in-btn">
                    <div class="sign-in">Sign In</div>
                    <div class="sign-in">></div>
                </button>
            </div>
        </section>
        <div class="container">
            <section class="hero">
            <h1>Ship Solana Contracts<br>
                in Minutes not Months
            </h1>
            <div id="line">
                <p> 
                    Winterfell eats
                    <span class="months">months</span>.
                    Ships in
                    <span class="minutes">minutes</span>
                </p>
            </div>
        </section>
        </div>
    </div>
</body>
</html>
